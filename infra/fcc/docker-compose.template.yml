# M1 FCC official-source template. Compose config and preflight do not build,
# pull, or run containers. Building remains a separate operator action.
name: hushflow-fcc

services:
  tee-node:
    build:
      context: ../..
      dockerfile: infra/fcc/tee-node.Dockerfile
    image: hushflow/tee-node:v0.0.24-source
    restart: "no"

  hushflow-extension:
    build:
      context: ../..
      dockerfile: services/fcc-extension/Dockerfile
    depends_on:
      tee-node:
        condition: service_started
    # The extension calls the tee-node at 127.0.0.1:SIGN_PORT. The shared
    # namespace keeps this wire private; neither service publishes a port.
    network_mode: service:tee-node
    environment:
      EXTENSION_PORT: "${EXTENSION_PORT:-7702}"
      SIGN_PORT: "${SIGN_PORT:-7701}"
    restart: "no"
