name: hushflow-local

services:
  postgres:
    image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    environment:
      POSTGRES_DB: hushflow
      POSTGRES_PASSWORD: hushflow-local-only
      POSTGRES_USER: hushflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hushflow -d hushflow"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"
    tmpfs:
      - /var/lib/postgresql
